[package]
name = "relationaltext-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WASM bindings for the RelationalText rich text toolkit"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
relationaltext-core = { path = "../relationaltext-core" }
panproto-protocols = { workspace = true }
panproto-lens = { workspace = true }
panproto-inst = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "0.2"
js-sys = "0.3"
thiserror = { workspace = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"
